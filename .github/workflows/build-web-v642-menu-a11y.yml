name: Build WEB IBERFIT V6.42 menu a11y

on:
  push:
    branches:
      - work/web-v6-42-performance-budget
    paths:
      - '.github/workflows/build-web-v642-menu-a11y.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/web-v6-42-performance-budget
      - name: Integrar menú V6.42 y mantener caché versionada
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('candidate/v628')
          htmls=sorted(root.rglob('*.html'))
          assert len(htmls)==33
          for p in htmls:
              s=p.read_text(encoding='utf-8')
              assert s.count('/assets/menu.v632.js')==1,(p,s.count('/assets/menu.v632.js'))
              assert '/assets/menu.v642.js' not in s,p
              s=s.replace('/assets/menu.v632.js','/assets/menu.v642.js')
              assert s.count('/assets/menu.v642.js')==1,p
              assert '/assets/hardening.v630.js' not in s,p
              assert s.count('/assets/app.v632.js')==1,p
              p.write_text(s,encoding='utf-8')

          menu=root/'assets/menu.v642.js'
          assert menu.exists()
          text=menu.read_text(encoding='utf-8')
          assert "active === toggle" in text
          assert "active === firstNav" in text
          assert "active === lastNav" in text
          assert "event.shiftKey ? lastNav : firstNav" in text

          headers=root/'_headers'
          h=headers.read_text(encoding='utf-8')
          old="/assets/menu.v632.js\n  ! Cache-Control\n  Cache-Control: public, max-age=31536000, immutable\n  Content-Type: text/javascript; charset=utf-8\n"
          new="/assets/menu.v642.js\n  ! Cache-Control\n  Cache-Control: public, max-age=31536000, immutable\n  Content-Type: text/javascript; charset=utf-8\n"
          assert old in h
          assert new not in h
          h=h.replace(old,old+'\n'+new)
          headers.write_text(h,encoding='utf-8')

          ch=root/'CHANGELOG.md'
          s=ch.read_text(encoding='utf-8')
          assert s.startswith('# Cambios V6.42')
          marker='- Se preservan V6.41 CSP estricta, V6.40 cache policy, AEO/SEO, orientador, tracking, dock móvil, reduced motion y contenido.\n'
          addition='- La auditoría de teclado detectó además un defecto preexistente en el orden de foco del menú compacto: el botón está después del `<nav>` en el DOM y el trap anterior no podía garantizar Tab hacia el primer enlace. `menu.v642.js` define explícitamente el ciclo botón → primer enlace → … → último enlace → botón, y el recorrido inverso con Shift+Tab.\n'
          assert marker in s and addition not in s
          s=s.replace(marker,marker+addition)
          ch.write_text(s,encoding='utf-8')
          print({'html_updated':len(htmls),'menu':'menu.v642.js','hardening_absent':True})
          PY
          node --check candidate/v628/assets/menu.v642.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate/v628
          git commit -m 'a11y(web): fix compact menu keyboard cycle in V6.42'
          git push origin HEAD:work/web-v6-42-performance-budget
