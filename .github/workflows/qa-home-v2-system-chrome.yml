name: IBERFIT Home V2 · System Chrome visual proof\n# rerun: mobile privacy/menu polish

on:
  push:
    branches:
      - feat/signature-web-r423-20261102
    paths:
      - '.github/workflows/qa-home-v2-system-chrome.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-home-v2-system-chrome
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact Home-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='424700ae15c6138c8a07f15f82f5b34d62c51a9f'
          changed="$(git diff --name-only "$BASE" -- candidate/v628 | sort)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = '2'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/assets/signature-home.v644.css'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/index.html'
          python3 - <<'PY'
          import subprocess
          p='candidate/v628/index.html'
          base=subprocess.check_output(['git','show','424700ae15c6138c8a07f15f82f5b34d62c51a9f:'+p],text=True)
          head=open(p).read()
          link='<link href="/assets/signature-home.v644.css" rel="stylesheet"/>'
          assert head.count(link)==1
          assert head.replace(link,'')==base
          print('HOME_V2_SCOPE_OK')
          PY

      - name: Prepare exact baseline and local servers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iberfit-baseline /tmp/home-v2-proof
          git archive 424700ae15c6138c8a07f15f82f5b34d62c51a9f candidate/v628 | tar -x -C /tmp/iberfit-baseline
          python3 -m http.server 4173 --directory candidate/v628 >/tmp/home-v2-candidate.log 2>&1 &
          python3 -m http.server 4174 --directory /tmp/iberfit-baseline/candidate/v628 >/tmp/home-v2-baseline.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          curl -fsS http://127.0.0.1:4174/ >/dev/null

      - name: Locate preinstalled Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then BROWSER="$(command -v google-chrome)";
          elif command -v google-chrome-stable >/dev/null; then BROWSER="$(command -v google-chrome-stable)";
          elif command -v chromium >/dev/null; then BROWSER="$(command -v chromium)";
          else echo 'No system Chrome available'; exit 1; fi
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Render current and V2 at desktop and mobile
        shell: bash
        env:
          BROWSER: ${{ steps.chrome.outputs.browser }}
        run: |
          set -euo pipefail
          common=(--headless=new --disable-gpu --no-sandbox --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=2500)
          "$BROWSER" "${common[@]}" --force-device-scale-factor=2 --window-size=1440,1000 --screenshot=/tmp/home-v2-proof/baseline-desktop.png http://127.0.0.1:4174/
          "$BROWSER" "${common[@]}" --force-device-scale-factor=2 --window-size=1440,1000 --screenshot=/tmp/home-v2-proof/candidate-desktop.png http://127.0.0.1:4173/
          "$BROWSER" "${common[@]}" --force-device-scale-factor=2 --window-size=1440,7800 --screenshot=/tmp/home-v2-proof/candidate-desktop-full.png http://127.0.0.1:4173/
          "$BROWSER" "${common[@]}" --force-device-scale-factor=3 --window-size=390,844 --screenshot=/tmp/home-v2-proof/baseline-mobile.png http://127.0.0.1:4174/
          "$BROWSER" "${common[@]}" --force-device-scale-factor=3 --window-size=390,844 --screenshot=/tmp/home-v2-proof/candidate-mobile.png http://127.0.0.1:4173/
          test -s /tmp/home-v2-proof/candidate-desktop.png
          test -s /tmp/home-v2-proof/candidate-mobile.png

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: iberfit-home-v2-system-chrome-${{ github.run_id }}
          path: /tmp/home-v2-proof/
          if-no-files-found: error
          retention-days: 14
