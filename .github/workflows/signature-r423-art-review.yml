name: IBERFIT Web Signature R4.2.3 · Art review screenshots

on:
  push:
    branches:
      - feat/signature-web-r423-20261102
    paths:
      - '.github/workflows/signature-r423-art-review.yml'

permissions:
  contents: read

concurrency:
  group: iberfit-web-signature-r423-art-review
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Serve integrated candidate
        run: |
          python3 -m http.server 8791 --directory candidate/v628 >/tmp/art-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8791/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/art-http.log
          exit 1
      - name: Render nine art-review captures
        run: node .github/scripts/qa_signature_r423_art_review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iberfit-signature-r423-art-review-${{ github.run_id }}
          path: signature-r423-art-evidence/
          if-no-files-found: error
          retention-days: 14
