name: IBERFIT WEB · Live HTTP surface audit (read-only)
on:
  push:
    branches:
      - audit/prod-source-trace-20261119
    paths:
      - '.github/scripts/qa_live_http_surface.mjs'
      - '.github/workflows/qa-live-http-surface.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/qa_live_http_surface.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iberfit-live-http-${{ github.run_id }}
          path: evidence/live-http/report.json
          retention-days: 30
          if-no-files-found: error
