name: IBERFIT WEB · Production source trace (read-only)

on:
  push:
    branches:
      - audit/prod-source-trace-20261119
    paths:
      - '.github/scripts/qa_prod_source_trace.mjs'
      - '.github/workflows/qa-prod-source-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iberfit-web-prod-source-trace
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert immutable certified source base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 424700ae15c6138c8a07f15f82f5b34d62c51a9f HEAD
          test "$(git show 424700ae15c6138c8a07f15f82f5b34d62c51a9f:candidate/v628/VERSION | tr -d '\r\n ')" = "6.43.27"
          test "$(find candidate/v628 -type f | wc -l | tr -d ' ')" = "117"
          test "$(find candidate/v628 -type f -name '*.html' | wc -l | tr -d ' ')" = "33"
      - name: Compare every published asset against production and deployment URL
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT=evidence/prod-source-trace node .github/scripts/qa_prod_source_trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iberfit-prod-source-trace-${{ github.run_id }}
          path: evidence/prod-source-trace/source-trace.json
          retention-days: 30
          if-no-files-found: error
