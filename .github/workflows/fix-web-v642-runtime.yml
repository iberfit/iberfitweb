name: Fix WEB IBERFIT V6.42 runtime

on:
  push:
    branches:
      - work/web-v6-42-performance-budget
    paths:
      - '.github/workflows/fix-web-v642-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/web-v6-42-performance-budget
      - name: Restaurar controlador requerido y conservar optimización segura
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('candidate/v628')
          htmls=sorted(root.rglob('*.html'))
          assert len(htmls)==33
          for p in htmls:
              s=p.read_text(encoding='utf-8')
              assert s.count('/assets/app.v642.js')==1, p
              assert '/assets/hardening.v630.js' not in s, p
              s=s.replace('/assets/app.v642.js','/assets/app.v632.js')
              assert s.count('/assets/app.v632.js')==1, p
              assert s.count('/assets/menu.v632.js')==1, p
              p.write_text(s,encoding='utf-8')
          app642=root/'assets/app.v642.js'
          assert app642.exists(); app642.unlink()
          headers=root/'_headers'; h=headers.read_text(encoding='utf-8')
          block="\n/assets/app.v642.js\n  ! Cache-Control\n  Cache-Control: public, max-age=31536000, immutable\n  Content-Type: text/javascript; charset=utf-8\n"
          assert block in h
          h=h.replace(block,'')
          headers.write_text(h,encoding='utf-8')
          ch=root/'CHANGELOG.md'; t=ch.read_text(encoding='utf-8')
          assert t.startswith('# Cambios V6.42') and '\n# Cambios V6.41' in t
          rest='# Cambios V6.41'+t.split('\n# Cambios V6.41',1)[1]
          entry="""# Cambios V6.42\n\n- Se optimiza el runtime a partir de una línea base Lighthouse tomada contra producción real.\n- Se retira `hardening.v630.js` de las 33 páginas: ese script recorría elementos `.reveal` con `getBoundingClientRect()` aunque `app.v632.js` ya gestiona la misma aparición con `IntersectionObserver`, añadiendo trabajo redundante de scripting y layout en móvil.\n- Se conserva íntegro `app.v632.js` y `menu.v632.js`. La QA demostró que el controlador de menú de `app.v632.js` no era redundante: aporta la apertura, Escape, cierre por enlaces y tracking sobre los que `menu.v632.js` añade backdrop, `inert`, focus trap y sincronización ARIA.\n- La detección automática evitó promover una simplificación que habría degradado la navegación móvil; V6.42 mantiene por diseño las dos capas complementarias del menú.\n- Se preservan V6.41 CSP estricta, V6.40 cache policy, AEO/SEO, orientador, tracking, dock móvil, reduced motion y contenido.\n- La promoción a producción queda condicionada a regresión funcional completa y comparación Lighthouse preview vs producción. No se atribuyen mejoras de Core Web Vitals de campo sin datos CrUX.\n\n"""
          ch.write_text(entry+rest,encoding='utf-8')
          assert (root/'VERSION').read_text().strip()=='6.42'
          print({'html':len(htmls),'safe_change':'hardening reference removed','menu_layers':'preserved'})
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A candidate/v628
          git commit -m 'fix(web): preserve complementary menu layers in V6.42'
          git push origin HEAD:work/web-v6-42-performance-budget
