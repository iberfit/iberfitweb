name: Release WEB IBERFIT V6.43.10 origin story
on:
  push:
    branches: [work/web-v6-43-10-origin-story]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/web-v6-43-10-origin-story
          fetch-depth: 0
      - name: Verify exact V6.43.8 production source baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='b9de95e96ce2ab7cd8e999a6c1889c6921571086'
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(tr -d '\r\n ' < candidate/v628/VERSION)" = '6.43.8'
          test "$(find candidate/v628 -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          git diff --exit-code "$BASE" HEAD -- candidate/v628
      - name: Build V6.43.10 origin story
        run: python3 .github/scripts/build_v64310_origin_story.py
      - name: Validate exact scope and preserved contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE='b9de95e96ce2ab7cd8e999a6c1889c6921571086'
          root='candidate/v628'
          test "$(tr -d '\r\n ' < "$root/VERSION")" = '6.43.10'
          test -s "$root/assets/story.v64310.css"
          test "$(grep -R -l '/assets/story.v64310.css' "$root" --include='*.html' | wc -l | tr -d ' ')" = '2'
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          root=Path('candidate/v628');base='b9de95e96ce2ab7cd8e999a6c1889c6921571086'
          changed=subprocess.check_output(['git','diff','--name-only',base,'--','candidate/v628'],text=True).splitlines()
          expected={'candidate/v628/VERSION','candidate/v628/CHANGELOG.md','candidate/v628/sobre-iberfit/index.html','candidate/v628/en/about/index.html'}
          assert set(changed)==expected,(changed,expected)
          status=subprocess.check_output(['git','status','--porcelain','--','candidate/v628'],text=True).splitlines()
          untracked=sorted(line[3:] for line in status if line.startswith('?? '))
          assert untracked==['candidate/v628/assets/story.v64310.css'],untracked
          pat=re.compile(r'<script type="application/ld\+json">(.*?)</script>',re.S)
          for rel in ['sobre-iberfit/index.html','en/about/index.html']:
            now=(root/rel).read_text(encoding='utf-8'); old=subprocess.check_output(['git','show',f'{base}:candidate/v628/{rel}'],text=True)
            for m in pat.finditer(now): json.loads(m.group(1))
            assert '<script defer="" src="/assets/analytics.v643.js"></script>' in now
            assert '/assets/menu.v642.js' in now
            assert 'story.v64310.css' in now
            assert now.count('story.v64310.css')==1
            assert now.count('<section class="section origin-section">')==1
          assert 'un entrenador español' not in (root/'sobre-iberfit/index.html').read_text(encoding='utf-8').lower()
          print({'scope':'about ES/EN + version/changelog + one CSS','jsonld':'ok'})
          PY
          grep -q "script-src-attr 'none'" "$root/_headers"
          ! grep -q "'unsafe-inline'" "$root/_headers"
          git diff --exit-code "$BASE" -- "$root/_headers"
          git diff --check "$BASE" -- "$root"
      - name: Browser regression and origin story QA
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4178 --directory candidate/v628 >/tmp/v64310-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4178/ >/dev/null && break || true; sleep 1; done
          curl -fsS http://127.0.0.1:4178/ >/dev/null
          node .github/scripts/qa_v64310_origin_story.cjs
      - name: Commit certified V6.43.10 candidate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'iberfit'
          git config user.email 'iberfit.cl@gmail.com'
          git add candidate/v628
          git commit -m 'feat(web): make IBERFIT origin story evocative and institutional'
          git push origin HEAD:work/web-v6-43-10-origin-story
      - name: Save V6.43.10 visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v64310-origin-story-evidence
          path: |
            /tmp/v64310-server.log
            /tmp/v64310-evidence
          if-no-files-found: warn
          retention-days: 30
