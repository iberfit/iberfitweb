name: QA multidispositivo web V6.30
# Certificación visual y funcional en móvil, tableta y escritorio.
# Gate final conjunto V6.30 · SHA único

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "SHA exacto de la candidata V6.30 a certificar"
        required: false
        type: string
  push:
    branches:
      - work/web-v6-30-hardening
    paths:
      - "candidate/v628/**"
      - ".github/scripts/qa_v628_dispositivos.mjs"
      - ".github/workflows/qa-v628-dispositivos.yml"

permissions:
  contents: read

concurrency:
  group: qa-dispositivos-web-v630
  cancel-in-progress: true

jobs:
  dispositivos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar candidata actual
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Servir candidata
        run: |
          python -m http.server 4173 --directory candidate/v628 > /tmp/iberfit-web-server.log 2>&1 &
          echo $! > /tmp/iberfit-web-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iberfit-web-server.log
          exit 1

      - name: Probar móvil, tableta y escritorio
        run: node .github/scripts/qa_v628_dispositivos.mjs

      - name: Guardar evidencia visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-v628-dispositivos
          path: evidence/v628-devices
          if-no-files-found: warn
          retention-days: 30
