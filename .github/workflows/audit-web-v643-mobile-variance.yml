name: Audit WEB IBERFIT V6.43 mobile variance

on:
  push:
    branches:
      - audit/web-v643-performance-2026-09-19
    paths:
      - '.github/workflows/audit-web-v643-mobile-variance.yml'

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable deployments
        run: |
          set -euo pipefail
          test "$(curl -fsSL https://bce8848f.web-iberfit.pages.dev/VERSION | tr -d '\r\n ')" = '6.42'
          test "$(curl -fsSL https://7f90acba.web-iberfit.pages.dev/VERSION | tr -d '\r\n ')" = '6.43'
      - name: Install Lighthouse
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save lighthouse@12.8.2 >/dev/null
      - name: Run three paired mobile repeats on variance candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v643-variance/raw
          V42='https://bce8848f.web-iberfit.pages.dev'; V43='https://7f90acba.web-iberfit.pages.dev'
          for route in diagnostico-iri entrenador-personal-las-condes; do
            for run in 1 2 3; do
              npx lighthouse "$V42/$route/" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="/tmp/v643-variance/raw/v642-${route}-${run}.json" --only-categories=performance,accessibility,best-practices,seo
              npx lighthouse "$V43/$route/" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="/tmp/v643-variance/raw/v643-${route}-${run}.json" --only-categories=performance,accessibility,best-practices,seo
            done
          done
      - name: Summarize medians
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path'),dir='/tmp/v643-variance/raw';
          const median=a=>{const s=[...a].sort((x,y)=>x-y);return s[1]};
          const routes=['diagnostico-iri','entrenador-personal-las-condes'],versions=['v642','v643'];
          const out=[];
          for(const route of routes){const by={};for(const version of versions){const rows=[];for(let run=1;run<=3;run++){const j=JSON.parse(fs.readFileSync(path.join(dir,`${version}-${route}-${run}.json`)));rows.push({performance:Math.round(j.categories.performance.score*100),lcp:Math.round(j.audits['largest-contentful-paint'].numericValue),tbt:Math.round(j.audits['total-blocking-time'].numericValue),fcp:Math.round(j.audits['first-contentful-paint'].numericValue),cls:+j.audits['cumulative-layout-shift'].numericValue.toFixed(4),mainThread:Math.round(j.audits['mainthread-work-breakdown'].numericValue),bytes:Math.round(j.audits['total-byte-weight'].numericValue)});}by[version]={runs:rows};for(const k of Object.keys(rows[0]))by[version][k]=median(rows.map(x=>x[k]));}const d={route,v642:by.v642,v643:by.v643,delta:{}};for(const k of ['performance','lcp','tbt','fcp','cls','mainThread','bytes'])d.delta[k]=+(by.v643[k]-by.v642[k]).toFixed(4);out.push(d)}
          const report={note:'Three paired mobile Lighthouse repeats per immutable deployment and route; lab data, not field CWV.',out};fs.writeFileSync('/tmp/v643-variance/summary.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          const severe=out.filter(x=>x.delta.performance<-5||x.delta.lcp>600||x.delta.tbt>250||x.delta.cls>0.05);if(severe.length)process.exit(2);
          NODE
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v643-mobile-variance
          path: /tmp/v643-variance
          if-no-files-found: error
          retention-days: 30
