name: Release WEB IBERFIT V6.43.9 mobile chrome balance

on:
  push:
    branches:
      - work/web-v6-43-9-mobile-chrome-balance
    paths:
      - '.github/workflows/release-web-v6439-mobile-chrome-balance.yml'
      - '.github/scripts/build_v6439_mobile_chrome_balance.py'
      - '.github/scripts/qa_v6439_mobile_chrome_balance.cjs'

permissions:
  contents: write

concurrency:
  group: release-web-v6439-mobile-chrome-balance
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/web-v6-43-9-mobile-chrome-balance
          fetch-depth: 0

      - name: Verify exact V6.43.8 production source baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='b9de95e96ce2ab7cd8e999a6c1889c6921571086'
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(tr -d '\r\n ' < candidate/v628/VERSION)" = '6.43.8'
          test "$(find candidate/v628 -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          git diff --exit-code "$BASE" HEAD -- candidate/v628

      - name: Build V6.43.9 mobile chrome balance
        run: python3 .github/scripts/build_v6439_mobile_chrome_balance.py

      - name: Validate exact scope and preserved contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE='b9de95e96ce2ab7cd8e999a6c1889c6921571086'
          root='candidate/v628'
          test "$(tr -d '\r\n ' < "$root/VERSION")" = '6.43.9'
          test "$(find "$root" -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          test -s "$root/assets/chrome.v6439.css"
          test -s "$root/assets/chrome.v6439.js"
          test "$(grep -R -l '/assets/chrome.v6439.css' "$root" --include='*.html' | wc -l | tr -d ' ')" = '33'
          test "$(grep -R -l '/assets/chrome.v6439.js' "$root" --include='*.html' | wc -l | tr -d ' ')" = '33'
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          root=Path('candidate/v628');base='b9de95e96ce2ab7cd8e999a6c1889c6921571086'
          htmls=sorted(root.rglob('*.html'));assert len(htmls)==33
          changed=subprocess.check_output(['git','diff','--name-only',base,'--','candidate/v628'],text=True).splitlines()
          expected={'candidate/v628/VERSION','candidate/v628/CHANGELOG.md'}|{p.as_posix() for p in htmls}
          assert set(changed)==expected,(len(changed),sorted(set(changed)^expected))
          status=subprocess.check_output(['git','status','--porcelain','--','candidate/v628'],text=True).splitlines()
          untracked=sorted(line[3:] for line in status if line.startswith('?? '))
          assert untracked==['candidate/v628/assets/chrome.v6439.css','candidate/v628/assets/chrome.v6439.js'],untracked
          for p in htmls:
            rel=p.relative_to(root).as_posix();now=p.read_text(encoding='utf-8')
            old=subprocess.check_output(['git','show',f'{base}:candidate/v628/{rel}'],text=True)
            now=now.replace('<link href="/assets/chrome.v6439.css" rel="stylesheet"/>','').replace('<script defer src="/assets/chrome.v6439.js"></script>','')
            assert now==old,rel
          pat=re.compile(r'<script type="application/ld\+json">(.*?)</script>',re.S);blocks=0
          for p in htmls:
            for m in pat.finditer(p.read_text(encoding='utf-8')):json.loads(m.group(1));blocks+=1
          assert blocks>=32,blocks
          print({'html':len(htmls),'jsonld':blocks,'scope':'global references + version/changelog + 2 assets'})
          PY
          grep -q '/assets/inperson.v6438.css' "$root/presencial/index.html"
          grep -q '/assets/aeo-disclosure.v6437.css' "$root/index.html"
          grep -q '/assets/focus.v6436.css' "$root/index.html"
          grep -q '/assets/mobile.v6435.css' "$root/index.html"
          grep -q '/assets/analytics.v643.js' "$root/index.html"
          grep -q '/assets/menu.v642.js' "$root/index.html"
          grep -q "script-src-attr 'none'" "$root/_headers"
          ! grep -q "'unsafe-inline'" "$root/_headers"
          ! grep -R -q '/assets/hardening.v630.js' "$root" --include='*.html'
          git diff --exit-code "$BASE" -- "$root/_headers"
          git diff --check "$BASE" -- "$root"

      - name: Browser regression and mobile chrome QA
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4177 --directory candidate/v628 >/tmp/v6439-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4177/ >/dev/null && break || true; sleep 1; done
          curl -fsS http://127.0.0.1:4177/ >/dev/null
          node .github/scripts/qa_v6439_mobile_chrome_balance.cjs

      - name: Commit certified V6.43.9 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate/v628
          git commit -m 'fix(web): balance mobile navigation chrome in V6.43.9'
          git push origin HEAD:work/web-v6-43-9-mobile-chrome-balance

      - name: Save V6.43.9 visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v6439-mobile-chrome-evidence
          path: |
            /tmp/v6439-server.log
            /tmp/v6439-evidence
          if-no-files-found: warn
          retention-days: 30
