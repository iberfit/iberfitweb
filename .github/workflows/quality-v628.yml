name: Calidad profesional web V6.30
# Gate integral: marca, estructura, enlaces, accesibilidad, rendimiento, seguridad y SEO.
# Gate final conjunto V6.30 · SHA único

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "SHA exacto de la candidata V6.30 a certificar"
        required: false
        type: string
  push:
    branches:
      - work/web-v6-30-hardening
    paths:
      - "candidate/v628/**"
      - "llms.txt"
      - "brand/Isotipo_IBERFIT_Oficial.png"
      - ".github/scripts/qa_v628_accesibilidad.mjs"
      - ".github/scripts/qa_v628_profesional.py"
      - ".github/scripts/qa_v628_privacidad.mjs"
      - ".github/workflows/quality-v628.yml"

permissions:
  contents: read

concurrency:
  group: calidad-web-v630
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar candidata actual
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validar HTML y estructura
        run: |
          npx --yes html-validate@9 "candidate/v628/**/*.html" --rule no-inline-style:off --rule no-trailing-whitespace:off

      - name: Auditoría profesional estática
        run: python .github/scripts/qa_v628_profesional.py

      - name: Certificar isotipo oficial
        run: |
          set -euo pipefail
          echo "d4707b688db39e11fee7d027bf9d3f2514225dfc806797ae3f9379d710ef07aa  brand/Isotipo_IBERFIT_Oficial.png" | sha256sum -c -
          echo "d4707b688db39e11fee7d027bf9d3f2514225dfc806797ae3f9379d710ef07aa  candidate/v628/assets/iberfit-isotipo-oficial.png" | sha256sum -c -
          cmp -s brand/Isotipo_IBERFIT_Oficial.png candidate/v628/assets/iberfit-isotipo-oficial.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          expected_size=(173,192)
          expected_rgba="b7cb99020c981bca2891298df3abe164895ec4d7c2d93974b2eeb4733696f012"
          for path in (
              Path("brand/Isotipo_IBERFIT_Oficial.png"),
              Path("candidate/v628/assets/iberfit-isotipo-oficial.png"),
          ):
              with Image.open(path) as source:
                  im=source.convert("RGBA")
              actual=hashlib.sha256(im.tobytes()).hexdigest()
              print(path, im.size, actual)
              assert im.size == expected_size, (path, im.size)
              assert actual == expected_rgba, (path, actual)
          print("Isotipo oficial: bytes y píxeles certificados")
          PY

      - name: Servir candidata
        run: |
          python -m http.server 4173 --directory candidate/v628 > /tmp/iberfit-v628.log 2>&1 &
          echo $! > /tmp/iberfit-v628.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iberfit-v628.log
          exit 1

      - name: Enlaces internos
        run: |
          npx --yes linkinator@6 http://127.0.0.1:4173/ --recurse --skip "https://wa.me|https://www.google.com|https://share.google|mailto:|tel:" --verbosity error

      - name: Preparar Chromium para calidad
        run: |
          npm install --no-save playwright@1.62.1 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Accesibilidad
        run: node .github/scripts/qa_v628_accesibilidad.mjs

      - name: Privacidad y consentimiento
        run: node .github/scripts/qa_v628_privacidad.mjs

      - name: Lighthouse · Inicio
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            npx --yes lighthouse@12 http://127.0.0.1:4173/ \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="/tmp/lighthouse-home-$i.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const prefix='/tmp/lighthouse-home';
          const reports=[1,2,3].map(i=>JSON.parse(fs.readFileSync(`${prefix}-${i}.json`,'utf8')));
          const median=values=>[...values].sort((a,b)=>a-b)[1];
          const perf=reports.map(r=>r.categories.performance.score);
          const tbt=reports.map(r=>r.audits['total-blocking-time']?.numericValue ?? Infinity);
          const cls=reports.map(r=>r.audits['cumulative-layout-shift']?.numericValue ?? Infinity);
          const lcp=reports.map(r=>r.audits['largest-contentful-paint']?.numericValue ?? Infinity);
          const other=['accessibility','best-practices','seo'];
          reports.forEach((r,i)=>console.log('run',i+1,{
            performance:r.categories.performance.score,
            accessibility:r.categories.accessibility.score,
            bestPractices:r.categories['best-practices'].score,
            seo:r.categories.seo.score,
            tbt:tbt[i],cls:cls[i],lcp:lcp[i]
          }));
          const perfMedian=median(perf), tbtMedian=median(tbt), lcpMedian=median(lcp), clsMax=Math.max(...cls);
          let fail=perfMedian<0.95 || tbtMedian>300 || lcpMedian>2500 || clsMax>0.1;
          for(const k of other){
            const min=Math.min(...reports.map(r=>r.categories[k].score));
            console.log(k,'mínimo observado',min,'mínimo requerido',0.95);
            if(min<0.95) fail=true;
          }
          console.log('performance mediana',perfMedian,'mínimo',0.95);
          console.log('TBT mediana(ms)',tbtMedian,'máximo',300);
          console.log('LCP mediana(ms)',lcpMedian,'máximo',2500);
          console.log('CLS máximo',clsMax,'máximo',0.1);
          const medianIndex=perf.map((v,i)=>({i,d:Math.abs(v-perfMedian)})).sort((a,b)=>a.d-b.d)[0].i+1;
          fs.copyFileSync(`${prefix}-${medianIndex}.json`,`${prefix}.json`);
          if(fail) process.exit(1);
          NODE

      - name: Lighthouse · Diagnóstico IRI
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            npx --yes lighthouse@12 http://127.0.0.1:4173/diagnostico-iri/ \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="/tmp/lighthouse-iri-$i.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const prefix='/tmp/lighthouse-iri';
          const reports=[1,2,3].map(i=>JSON.parse(fs.readFileSync(`${prefix}-${i}.json`,'utf8')));
          const median=values=>[...values].sort((a,b)=>a-b)[1];
          const perf=reports.map(r=>r.categories.performance.score);
          const tbt=reports.map(r=>r.audits['total-blocking-time']?.numericValue ?? Infinity);
          const cls=reports.map(r=>r.audits['cumulative-layout-shift']?.numericValue ?? Infinity);
          const lcp=reports.map(r=>r.audits['largest-contentful-paint']?.numericValue ?? Infinity);
          const other=['accessibility','best-practices','seo'];
          reports.forEach((r,i)=>console.log('run',i+1,{
            performance:r.categories.performance.score,
            accessibility:r.categories.accessibility.score,
            bestPractices:r.categories['best-practices'].score,
            seo:r.categories.seo.score,
            tbt:tbt[i],cls:cls[i],lcp:lcp[i]
          }));
          const perfMedian=median(perf), tbtMedian=median(tbt), lcpMedian=median(lcp), clsMax=Math.max(...cls);
          let fail=perfMedian<0.95 || tbtMedian>300 || lcpMedian>2500 || clsMax>0.1;
          for(const k of other){
            const min=Math.min(...reports.map(r=>r.categories[k].score));
            console.log(k,'mínimo observado',min,'mínimo requerido',0.95);
            if(min<0.95) fail=true;
          }
          console.log('performance mediana',perfMedian,'mínimo',0.95);
          console.log('TBT mediana(ms)',tbtMedian,'máximo',300);
          console.log('LCP mediana(ms)',lcpMedian,'máximo',2500);
          console.log('CLS máximo',clsMax,'máximo',0.1);
          const medianIndex=perf.map((v,i)=>({i,d:Math.abs(v-perfMedian)})).sort((a,b)=>a.d-b.d)[0].i+1;
          fs.copyFileSync(`${prefix}-${medianIndex}.json`,`${prefix}.json`);
          if(fail) process.exit(1);
          NODE

      - name: Compatibilidad y descubrimiento por IA
        run: |
          set -euo pipefail
          test -s candidate/v628/llms.txt
          grep -q '^# IBERFIT' candidate/v628/llms.txt
          grep -q 'Diagnóstico IRI' candidate/v628/llms.txt
          grep -q 'https://iberfit.cl/sitemap.xml' candidate/v628/llms.txt
          grep -q 'https://app.iberfit.cl/' candidate/v628/llms.txt

      - name: Seguridad estática
        run: |
          grep -q "Content-Security-Policy:" candidate/v628/_headers
          grep -q "Strict-Transport-Security:" candidate/v628/_headers
          grep -q "X-Content-Type-Options: nosniff" candidate/v628/_headers
          grep -q "Referrer-Policy:" candidate/v628/_headers
          grep -q "Permissions-Policy:" candidate/v628/_headers
          ! grep -R -P 'http://(?!127\.0\.0\.1|www\.w3\.org/2000/svg)' candidate/v628 --include="*.html" --include="*.js" --include="*.css"

      - name: SEO internacional
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonical=False
                  self.description=False
                  self.og_title=False
                  self.og_description=False
                  self.viewport=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="link" and a.get("rel")=="canonical" and a.get("href"):
                      self.canonical=True
                  if tag=="meta":
                      if a.get("name")=="description" and a.get("content"):
                          self.description=True
                      if a.get("property")=="og:title" and a.get("content"):
                          self.og_title=True
                      if a.get("property")=="og:description" and a.get("content"):
                          self.og_description=True
                      if a.get("name")=="viewport" and a.get("content"):
                          self.viewport=True

          pages=list(Path("candidate/v628").rglob("*.html"))
          errors=[]
          for page in pages:
              if page.name=="404.html":
                  continue
              p=MetaParser()
              p.feed(page.read_text(encoding="utf-8"))
              checks={
                  "canonical":p.canonical,
                  "description":p.description,
                  "og:title":p.og_title,
                  "og:description":p.og_description,
                  "viewport":p.viewport,
              }
              for label, ok in checks.items():
                  if not ok:
                      errors.append(f"{page}: {label} ausente")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print(f"SEO base validado en {len(pages)} HTML · sin dependencias externas")
          PY

      - name: Guardar informes Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calidad-v628-lighthouse
          path: |
            /tmp/lighthouse-home.json
            /tmp/lighthouse-iri.json
          if-no-files-found: ignore
          retention-days: 30
