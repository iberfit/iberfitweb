name: Release WEB IBERFIT V6.43.26 local editorial policy

on:
  push:
    branches: [work/web-v6-43-26-local-editorial-policy]
    paths:
      - .github/workflows/release-web-v64326-local-editorial-policy.yml
      - .github/scripts/build_v64326_local_editorial_policy.py
      - .github/scripts/qa_v64326_local_editorial_policy.py
      - .github/scripts/qa_v64326_browser.mjs
      - .github/data/v64326-local-editorial-policy.md

permissions:
  contents: write

concurrency:
  group: web-v64326-local-editorial-policy
  cancel-in-progress: false

env:
  BASE_SHA: '69c41ce35ca0eba65f4c1b8653f15717bca7037a'
  VERSION: '6.43.26'

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Rebuild from exact V6.43.25 production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git show "$BASE_SHA":candidate/v628/VERSION | tr -d '\r\n ')" = '6.43.25'
          git restore --source="$BASE_SHA" --staged --worktree candidate/v628
          node .github/scripts/qa_bilingual_architecture.cjs
          python3 .github/scripts/build_v64326_local_editorial_policy.py

      - name: Static global local-policy and bilingual contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/qa_v64326_local_editorial_policy.py
          node .github/scripts/qa_bilingual_architecture.cjs
          test "$(find candidate/v628 -type f -name '*.html' | wc -l | tr -d ' ')" = '33'
          test "$(tr -d '\r\n ' < candidate/v628/VERSION)" = "$VERSION"
          git diff --check

      - name: Browser regression and V6.43.26 local QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          python3 -m http.server 4173 --directory candidate/v628 >/tmp/http.log 2>&1 &
          pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ok=1; break; fi
            sleep .5
          done
          test "$ok" -eq 1
          QA_OUT=/tmp/v64321-regression node .github/scripts/qa_v64321_browser.mjs
          QA_OUT=/tmp/v64322-regression node .github/scripts/qa_v64322_browser.mjs
          QA_OUT=/tmp/v64323-regression node .github/scripts/qa_v64323_browser.mjs
          QA_OUT=/tmp/v64325-regression node .github/scripts/qa_v64325_browser.mjs
          QA_OUT=/tmp/v64326-screens node .github/scripts/qa_v64326_browser.mjs

      - name: Verify exact product scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^candidate/v628/' >/tmp/outside; then
            echo 'Unexpected non-product changes during build:'
            cat /tmp/outside
            exit 1
          fi
          python3 .github/scripts/qa_v64326_local_editorial_policy.py

      - name: Commit certified V6.43.26 product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IBERFIT Release Bot'
          git config user.email 'iberfit-release@users.noreply.github.com'
          git add candidate/v628
          git diff --cached --quiet && { echo 'Expected certified product changes but found none'; exit 1; }
          git commit -m 'feat(web): certify V6.43.26 local editorial policy'
          git push origin HEAD:work/web-v6-43-26-local-editorial-policy

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-v64326-local-policy-evidence
          path: |
            /tmp/v64326-screens
            /tmp/v64325-regression/metrics.json
            /tmp/v64323-regression/metrics.json
            /tmp/v64322-regression/metrics.json
            /tmp/v64321-regression/metrics.json
            /tmp/http.log
          if-no-files-found: warn
          retention-days: 30

# certification trigger 2026-10-01
