name: QA WEB IBERFIT V6.29 experience

on:
  push:
    branches:
      - work/web-v6-29-experience
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-web-v629-experience
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Servir candidata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory candidate/v628 >/tmp/v629-server.log 2>&1 &
          echo $! >/tmp/v629-server.pid
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v629-server.log
          exit 1

      - name: QA funcional y visual V6.29
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v629-evidence
          cat > /tmp/qa-v629.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'http://127.0.0.1:4173';
          const localRoutes = [
            ['/entrenador-personal-las-condes/', 'Las Condes'],
            ['/entrenador-personal-vitacura/', 'Vitacura'],
            ['/entrenamiento-personal-providencia/', 'Providencia'],
            ['/personal-trainer-nunoa/', 'Ñuñoa'],
            ['/entrenador-personal-lo-barnechea/', 'Lo Barnechea'],
            ['/entrenador-personal-la-reina/', 'La Reina'],
            ['/entrenador-personal-penalolen/', 'Peñalolén']
          ];
          const failures = [];
          const notes = [];
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          async function openPage(context, path, label) {
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
            const response = await page.goto(base + path, { waitUntil: 'networkidle' });
            assert(response && response.ok(), label + ': HTTP no OK');
            await page.waitForTimeout(350);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert(overflow <= 2, label + ': overflow horizontal ' + overflow + 'px');
            if (errors.length) throw new Error(label + ': ' + errors.join(' | '));
            return page;
          }

          async function verifyCarousel(page, label) {
            await page.locator('.review-carousel-shell').waitFor();
            assert(await page.locator('.review-slide').count() === 2, label + ': deben existir 2 reseñas reales');
            assert(await page.locator('.review-slide.is-active').count() === 1, label + ': debe haber una sola reseña activa');
            assert(await page.locator('.review-source-row a[href*="google"]').count() === 0, label + ': las reseñas no deben sacar al usuario a Google');
            const first = await page.locator('.review-slide.is-active').getAttribute('data-review-index');
            await page.waitForTimeout(2250);
            const second = await page.locator('.review-slide.is-active').getAttribute('data-review-index');
            assert(first !== second, label + ': el carrusel no avanzó a los 2 segundos');
            await page.locator('[data-review-pause]').click();
            const paused = await page.locator('.review-slide.is-active').getAttribute('data-review-index');
            await page.waitForTimeout(2250);
            const pausedAfter = await page.locator('.review-slide.is-active').getAttribute('data-review-index');
            assert(paused === pausedAfter, label + ': la pausa no detuvo el carrusel');
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });

              const home = await openPage(desktop, '/', 'home desktop');
              await verifyCarousel(home, 'home');
              await home.screenshot({ path: '/tmp/v629-evidence/home-desktop.png', fullPage: true });
              notes.push('home: carrusel 2s + pausa + sin salida Google PASS');
              await home.close();

              const about = await openPage(desktop, '/sobre-iberfit/', 'sobre IBERFIT desktop');
              const journeyNames = await about.locator('.brand-journey article strong').allTextContents();
              const journeyFlags = await about.locator('.brand-journey .journey-flag').allTextContents();
              assert(JSON.stringify(journeyNames.map(x => x.trim())) === JSON.stringify(['España','Alemania','España','Chile']), 'sobre: recorrido de países incorrecto: ' + JSON.stringify(journeyNames));
              assert(JSON.stringify(journeyFlags.map(x => x.trim())) === JSON.stringify(['🇪🇸','🇩🇪','🇪🇸','🇨🇱']), 'sobre: banderas incorrectas: ' + JSON.stringify(journeyFlags));
              await verifyCarousel(about, 'sobre');
              await about.screenshot({ path: '/tmp/v629-evidence/sobre-desktop.png', fullPage: true });
              notes.push('sobre: España→Alemania→España→Chile con banderas + carrusel PASS');
              await about.close();

              const online = await openPage(desktop, '/online/', 'online desktop');
              assert(await online.locator('[data-country-selector]').count() === 0, 'online: no debe existir selector de países');
              await online.screenshot({ path: '/tmp/v629-evidence/online-desktop.png', fullPage: true });
              notes.push('online: sin selector de países artificial PASS');
              await online.close();

              for (const [route, place] of localRoutes) {
                const page = await openPage(desktop, route, place + ' desktop');
                await page.locator('.local-place-badge').waitFor();
                const badge = (await page.locator('.local-place-badge strong').textContent()).trim();
                assert(badge === place, route + ': badge esperado ' + place + ', obtenido ' + badge);
                assert(await page.locator('.local-service-chip').count() === 4, route + ': deben existir 4 opciones de cobertura');
                const chips = (await page.locator('.local-service-chip').allTextContents()).join(' ');
                assert(/Parque o zona verde/i.test(chips), route + ': falta parque o zona verde');
                const cards = page.locator('.cards-4');
                if (await cards.count()) {
                  const columns = await cards.evaluate(el => getComputedStyle(el).gridTemplateColumns.split(' ').filter(Boolean).length);
                  assert(columns === 2, route + ': tarjetas locales deben ser 2x2 en escritorio');
                }
                await page.screenshot({ path: '/tmp/v629-evidence/' + place.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-') + '-desktop.png', fullPage: true });
                notes.push(route + ': identidad local + domicilio + gimnasio + parque + híbrido PASS');
                await page.close();
              }
              await desktop.close();

              const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
              const mobileRoutes = [['/', 'home mobile'], ['/sobre-iberfit/', 'sobre mobile'], ['/online/', 'online mobile'], ...localRoutes.map(([r,p]) => [r, p + ' mobile'])];
              for (const [path, label] of mobileRoutes) {
                const page = await openPage(mobile, path, label);
                if (path === '/' || path === '/sobre-iberfit/') {
                  assert(await page.locator('.review-slide.is-active').count() === 1, label + ': más de una reseña activa');
                }
                if (path === '/sobre-iberfit/') {
                  assert(await page.locator('.journey-flag').count() === 4, 'sobre mobile: faltan banderas');
                }
                if (path === '/online/') {
                  assert(await page.locator('[data-country-selector]').count() === 0, 'online mobile: no debe existir selector de países');
                }
                if (localRoutes.some(([route]) => route === path)) {
                  assert(await page.locator('.local-place-badge').count() === 1, label + ': badge local ausente');
                  assert(await page.locator('.local-service-chip').count() === 4, label + ': cobertura local incompleta');
                }
                await page.close();
              }
              notes.push('mobile 390px: home + sobre + online + 7 comunas sin overflow PASS');
              await mobile.close();

              const reduced = await browser.newContext({ viewport: { width: 390, height: 844 }, reducedMotion: 'reduce' });
              for (const route of ['/', '/sobre-iberfit/']) {
                const page = await openPage(reduced, route, route + ' reduced motion');
                const r1 = await page.locator('.review-slide.is-active').getAttribute('data-review-index');
                await page.waitForTimeout(2250);
                const r2 = await page.locator('.review-slide.is-active').getAttribute('data-review-index');
                assert(r1 === r2, route + ': reduced-motion no debe autoavanzar');
                await page.close();
              }
              notes.push('prefers-reduced-motion: carruseles sin autoavance PASS');
              await reduced.close();

              fs.writeFileSync('/tmp/v629-evidence/report.json', JSON.stringify({ ok: true, notes }, null, 2));
              console.log('QA V6.29 EXPERIENCE: PASS');
              notes.forEach(n => console.log('PASS · ' + n));
            } catch (e) {
              failures.push(e.stack || String(e));
              fs.writeFileSync('/tmp/v629-evidence/report.json', JSON.stringify({ ok: false, failures, notes }, null, 2));
              console.error(e.stack || e);
              process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })();
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/qa-v629.js

      - name: Verificar referencias y contenido
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate/v628/assets/experience.v629.css
          test -s candidate/v628/assets/experience.v629.js
          grep -Fq 'data-review-carousel' candidate/v628/index.html
          grep -Fq 'data-review-carousel' candidate/v628/sobre-iberfit/index.html
          grep -Fq '🇪🇸' candidate/v628/sobre-iberfit/index.html
          grep -Fq '🇩🇪' candidate/v628/sobre-iberfit/index.html
          grep -Fq '🇨🇱' candidate/v628/sobre-iberfit/index.html
          ! grep -Fq 'const countries = [' candidate/v628/assets/experience.v629.js
          ! grep -Fq 'country-selector' candidate/v628/assets/experience.v629.js
          grep -Fq 'Parque o zona verde' candidate/v628/assets/experience.v629.js
          for f in             candidate/v628/entrenador-personal-la-reina/index.html             candidate/v628/entrenador-personal-las-condes/index.html             candidate/v628/entrenador-personal-lo-barnechea/index.html             candidate/v628/entrenador-personal-penalolen/index.html             candidate/v628/entrenador-personal-vitacura/index.html             candidate/v628/entrenamiento-personal-providencia/index.html             candidate/v628/personal-trainer-nunoa/index.html; do
            grep -Fq 'experience.v629.css' "$f"
            grep -Fq 'experience.v629.js' "$f"
          done

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-web-v629-experience-${{ github.run_id }}
          path: /tmp/v629-evidence
          if-no-files-found: warn
          retention-days: 30
