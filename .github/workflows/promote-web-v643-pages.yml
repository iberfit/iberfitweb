name: Promote WEB IBERFIT V6.43 to Cloudflare Pages

on:
  push:
    branches:
      - work/web-v6-43-cro-observability
    paths:
      - ".github/workflows/promote-web-v643-pages.yml"

permissions:
  contents: read

concurrency:
  group: web-iberfit-v643-pages-promotion
  cancel-in-progress: false

env:
  CF_ACCOUNT_ID: "5b03d387427d367674b9d05b8bdf7c84"
  CF_PROJECT_NAME: "web-iberfit"
  WRANGLER_VERSION: "4.120.0"
  CERTIFIED_SHA: "8db17d17e45eb235335c408dbe962bc1d8104e43"

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact promotion commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify certified candidate stayed immutable
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "${CERTIFIED_SHA}" HEAD)
          printf 'Changes since certified SHA:\n%s\n' "${changed[*]:-none}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/promote-web-v643-pages.yml"
          test "$(tr -d '\r\n ' < candidate/v628/VERSION)" = "6.43"
          test "$(find candidate/v628 -name '*.html' -type f | wc -l | tr -d ' ')" = "33"
          test -s candidate/v628/assets/analytics.v643.js
          test -s candidate/v628/assets/menu.v642.js
          ! find candidate/v628 -name '*.html' -type f -print0 | xargs -0 grep -q '/assets/hardening.v630.js'
          test "$(find candidate/v628 -name '*.html' -type f -print0 | xargs -0 grep -l '/assets/analytics.v643.js' | wc -l | tr -d ' ')" = "33"
          ! find candidate/v628 -name '*.html' -type f -print0 | xargs -0 grep -q '/assets/analytics.v632.js'

      - name: Discover Cloudflare Pages production and verify live V6.42 preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 41; }
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}" \
            -o /tmp/project.json
          curl --fail --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?per_page=25" \
            -o /tmp/deployments-before.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          const d=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          if(!p.success) throw new Error('PAGES_PROJECT_LOOKUP_FAILED:'+JSON.stringify(p.errors||[]));
          if(!d.success||!Array.isArray(d.result)) throw new Error('PAGES_DEPLOYMENTS_LOOKUP_FAILED:'+JSON.stringify(d.errors||[]));
          const productionBranch=p.result.production_branch;
          if(!productionBranch) throw new Error('PAGES_PRODUCTION_BRANCH_MISSING');
          const productions=d.result.filter(x=>x.environment==='production' && (!x.latest_stage || x.latest_stage.status==='success'));
          if(!productions.length) throw new Error('NO_SUCCESSFUL_PRODUCTION_DEPLOYMENT');
          productions.sort((a,b)=>new Date(b.created_on)-new Date(a.created_on));
          const rollback=productions[0];
          fs.appendFileSync(process.env.GITHUB_ENV,`PRODUCTION_BRANCH=${productionBranch}\nROLLBACK_DEPLOYMENT_ID=${rollback.id}\nROLLBACK_DEPLOYMENT_URL=${rollback.url||''}\nPRODUCTION_TOUCHED=0\n`);
          fs.writeFileSync('/tmp/preflight.json',JSON.stringify({productionBranch,rollbackDeploymentId:rollback.id,rollbackDeploymentUrl:rollback.url||null},null,2)+'\n');
          console.log(JSON.stringify({productionBranch,rollbackDeploymentId:rollback.id,rollbackDeploymentUrl:rollback.url||null},null,2));
          NODE
          live_version="$(curl --fail --silent --show-error --location --retry 4 --retry-all-errors -H 'Cache-Control: no-cache' "https://iberfit.cl/VERSION?preflight=${GITHUB_RUN_ID}" | tr -d '\r\n ')"
          echo "Live preflight VERSION=${live_version}"
          test "$live_version" = "6.42"
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "https://iberfit.cl/?preflight=${GITHUB_RUN_ID}" -o /tmp/live-before.html
          grep -q '/assets/menu.v642.js' /tmp/live-before.html
          ! grep -q '/assets/hardening.v630.js' /tmp/live-before.html
          grep -q '/assets/analytics.v632.js' /tmp/live-before.html

      - name: Deploy immutable V6.43 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_BRANCH="v643-certified-${GITHUB_RUN_ID}"
          echo "PREVIEW_BRANCH=$PREVIEW_BRANCH" >> "$GITHUB_ENV"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy candidate/v628 \
            --project-name "${CF_PROJECT_NAME}" \
            --branch "$PREVIEW_BRANCH" | tee /tmp/wrangler-preview.log
          sleep 5
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?per_page=25" \
            -o /tmp/deployments-preview.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-preview.json','utf8'));
          if(!x.success||!Array.isArray(x.result)) throw new Error('PREVIEW_DEPLOYMENTS_LOOKUP_FAILED');
          const branch=process.env.PREVIEW_BRANCH;
          const matches=x.result.filter(d=>d.environment==='preview' && d.deployment_trigger?.metadata?.branch===branch);
          matches.sort((a,b)=>new Date(b.created_on)-new Date(a.created_on));
          const d=matches[0];
          if(!d||!d.id||!d.url) throw new Error('PREVIEW_DEPLOYMENT_NOT_FOUND_FOR_BRANCH:'+branch);
          fs.appendFileSync(process.env.GITHUB_ENV,`PREVIEW_DEPLOYMENT_ID=${d.id}\nPREVIEW_URL=${d.url}\n`);
          fs.writeFileSync('/tmp/preview.json',JSON.stringify({branch,id:d.id,url:d.url,aliases:d.aliases||[]},null,2)+'\n');
          console.log(JSON.stringify({branch,id:d.id,url:d.url,aliases:d.aliases||[]},null,2));
          NODE

      - name: Verify V6.43 preview over Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --fail --silent --show-error --location --retry 6 --retry-all-errors "${PREVIEW_URL}/VERSION" | tr -d '\r\n ')" = "6.43"
          curl --fail --silent --show-error --location "${PREVIEW_URL}/" -o /tmp/preview-home.html
          grep -q '/assets/analytics.v643.js' /tmp/preview-home.html
          grep -q '/assets/menu.v642.js' /tmp/preview-home.html
          ! grep -q '/assets/analytics.v632.js' /tmp/preview-home.html
          ! grep -q '/assets/hardening.v630.js' /tmp/preview-home.html
          curl --fail --silent --show-error --location -D /tmp/preview-headers.txt -o /dev/null "${PREVIEW_URL}/"
          grep -qi "script-src-attr 'none'" /tmp/preview-headers.txt
          python3 - <<'PY'
          import re, subprocess, pathlib, os
          xml=pathlib.Path('candidate/v628/sitemap.xml').read_text(encoding='utf-8')
          routes=[]
          for u in re.findall(r'<loc>https://iberfit\.cl([^<]*)</loc>', xml):
              routes.append(u or '/')
          if len(routes) != 33:
              raise SystemExit(f'EXPECTED_33_SITEMAP_ROUTES_GOT_{len(routes)}')
          base=os.environ['PREVIEW_URL'].rstrip('/')
          for route in routes:
              url=base + (route if route.startswith('/') else '/'+route)
              subprocess.run(['curl','--fail','--silent','--show-error','--location','--retry','3','--retry-all-errors','-o','/dev/null',url],check=True)
          print(f'PREVIEW_HTTP_OK_ROUTES={len(routes)}')
          PY

      - name: Browser smoke preview mobile menu and consent gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},hasTouch:true});
            const analyticsRequests=[];
            page.on('request',r=>{ if(/googletagmanager|google-analytics/.test(r.url())) analyticsRequests.push(r.url()); });
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.PREVIEW_URL+'/',{waitUntil:'networkidle'});
            if(analyticsRequests.length) throw new Error('ANALYTICS_REQUEST_BEFORE_CONSENT:'+analyticsRequests.join(','));
            const button=page.locator('[data-menu-toggle]');
            await button.click();
            if(await button.getAttribute('aria-expanded')!=='true') throw new Error('MENU_DID_NOT_OPEN');
            await page.keyboard.press('Escape');
            if(await button.getAttribute('aria-expanded')!=='false') throw new Error('MENU_DID_NOT_CLOSE_ON_ESCAPE');
            if(errors.length) throw new Error('PAGE_ERRORS:'+errors.join(' | '));
            await page.goto(process.env.PREVIEW_URL+'/en/',{waitUntil:'domcontentloaded'});
            if(await page.locator('script[src="/assets/analytics.v643.js"]').count()!==1) throw new Error('EN_ANALYTICS_V643_MISSING');
            await browser.close();
            console.log('PREVIEW_BROWSER_SMOKE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Promote V6.43 to Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy candidate/v628 \
            --project-name "${CF_PROJECT_NAME}" \
            --branch "${PRODUCTION_BRANCH}" | tee /tmp/wrangler-production.log
          echo "PRODUCTION_TOUCHED=1" >> "$GITHUB_ENV"
          sleep 5
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?per_page=25" \
            -o /tmp/deployments-after.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8'));
          if(!x.success||!Array.isArray(x.result)) throw new Error('PRODUCTION_DEPLOYMENTS_LOOKUP_FAILED');
          const branch=process.env.PRODUCTION_BRANCH;
          const matches=x.result.filter(d=>d.environment==='production' && d.deployment_trigger?.metadata?.branch===branch);
          matches.sort((a,b)=>new Date(b.created_on)-new Date(a.created_on));
          const d=matches[0];
          if(!d||!d.id||!d.url) throw new Error('PRODUCTION_DEPLOYMENT_NOT_FOUND_FOR_BRANCH:'+branch);
          if(d.id===process.env.ROLLBACK_DEPLOYMENT_ID) throw new Error('PRODUCTION_DEPLOYMENT_DID_NOT_ADVANCE');
          fs.appendFileSync(process.env.GITHUB_ENV,`PRODUCTION_DEPLOYMENT_ID=${d.id}\nPRODUCTION_DEPLOYMENT_URL=${d.url}\n`);
          fs.writeFileSync('/tmp/production.json',JSON.stringify({branch,id:d.id,url:d.url,aliases:d.aliases||[]},null,2)+'\n');
          console.log(JSON.stringify({branch,id:d.id,url:d.url,aliases:d.aliases||[]},null,2));
          NODE

      - name: Verify production propagation and invariants
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            echo "Production verification attempt ${attempt}/18"
            if version="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/VERSION?verify=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null | tr -d '\r\n ')" && [ "$version" = "6.43" ]; then
              if curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/?verify=${GITHUB_RUN_ID}-${attempt}" -o /tmp/live-after.html \
                && grep -q '/assets/analytics.v643.js' /tmp/live-after.html \
                && grep -q '/assets/menu.v642.js' /tmp/live-after.html \
                && ! grep -q '/assets/analytics.v632.js' /tmp/live-after.html \
                && ! grep -q '/assets/hardening.v630.js' /tmp/live-after.html; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" = "1"
          for path in /diagnostico-iri/ /metodo/ /presencial/ /hibrido/ /online/ /contacto/ /en/ /en/contact/; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors -o /dev/null "https://iberfit.cl${path}?verify=${GITHUB_RUN_ID}"
          done
          curl --fail --silent --show-error --location -D /tmp/live-headers.txt -o /dev/null "https://iberfit.cl/?headers=${GITHUB_RUN_ID}"
          grep -qi "script-src-attr 'none'" /tmp/live-headers.txt
          echo "PRODUCTION_V643_VERIFIED=1" >> "$GITHUB_ENV"

      - name: Write promotion evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const out={
            version:'6.43',
            certifiedSha:process.env.CERTIFIED_SHA,
            promotionCommit:process.env.GITHUB_SHA,
            preview:{branch:process.env.PREVIEW_BRANCH,id:process.env.PREVIEW_DEPLOYMENT_ID,url:process.env.PREVIEW_URL},
            production:{branch:process.env.PRODUCTION_BRANCH,id:process.env.PRODUCTION_DEPLOYMENT_ID,url:process.env.PRODUCTION_DEPLOYMENT_URL,verified:true},
            rollback:{id:process.env.ROLLBACK_DEPLOYMENT_ID,url:process.env.ROLLBACK_DEPLOYMENT_URL},
            verifiedAt:new Date().toISOString()
          };
          fs.writeFileSync('V643_PROMOTION_EVIDENCE.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Automatic rollback if production verification fails
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PRODUCTION_TOUCHED:-0}" != "1" ]; then
            echo "Production was not touched; rollback is unnecessary."
            exit 0
          fi
          test -n "${ROLLBACK_DEPLOYMENT_ID:-}" || { echo ROLLBACK_ID_MISSING; exit 51; }
          echo "Rolling back production to ${ROLLBACK_DEPLOYMENT_ID}"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments/${ROLLBACK_DEPLOYMENT_ID}/rollback" \
            --data '{}' -o /tmp/rollback.json
          node -e "const x=require('/tmp/rollback.json'); if(!x.success) throw new Error(JSON.stringify(x.errors||[])); console.log('ROLLBACK_API_OK')"
          for attempt in $(seq 1 18); do
            if version="$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "https://iberfit.cl/VERSION?rollback=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null | tr -d '\r\n ')" && [ "$version" = "6.42" ]; then
              echo "ROLLBACK_TO_V642_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "ROLLBACK_PROPAGATION_NOT_VERIFIED"
          exit 52

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-iberfit-v643-promotion-${{ github.run_id }}
          path: |
            V643_PROMOTION_EVIDENCE.json
            /tmp/preflight.json
            /tmp/preview.json
            /tmp/production.json
            /tmp/wrangler-preview.log
            /tmp/wrangler-production.log
            /tmp/preview-headers.txt
            /tmp/live-headers.txt
            /tmp/rollback.json
          if-no-files-found: warn
          retention-days: 30
