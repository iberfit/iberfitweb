name: Diagnose WEB IBERFIT V6.42 menu focus

on:
  push:
    branches:
      - work/web-v6-42-performance-budget
    paths:
      - '.github/workflows/diag-web-v642-menu-focus.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preparar navegador y candidata
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --directory candidate/v628 >/tmp/menu-diag-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Comparar foco en producción y candidata
        shell: bash
        run: |
          set -euo pipefail
          cat > menu-diag.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const mobile of [true,false]){
              for(const [label,url] of [['production','https://iberfit.cl/'],['candidate','http://127.0.0.1:4173/']]){
                const context=await browser.newContext({viewport:{width:390,height:844},isMobile:mobile,hasTouch:mobile});
                const page=await context.newPage();
                await page.goto(url,{waitUntil:'networkidle'});
                const toggle=page.locator('[data-menu-toggle]');
                await toggle.click();
                for(const delay of [0,20,120,400]){
                  if(delay)await page.waitForTimeout(delay);
                  const state=await page.evaluate(()=>{const nav=document.querySelector('[data-navlinks]'),a=document.activeElement;return {activeTag:a?.tagName,activeText:(a?.textContent||'').trim().slice(0,40),activeClass:a?.className||'',inNav:!!nav?.contains(a),expanded:document.querySelector('[data-menu-toggle]')?.getAttribute('aria-expanded'),open:nav?.classList.contains('open'),backdrop:document.querySelector('.nav-panel-backdrop')?.classList.contains('is-visible'),navHidden:nav?.getAttribute('aria-hidden')}});
                  console.log(JSON.stringify({mobile,label,delay,...state}));
                }
                await context.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node menu-diag.cjs
