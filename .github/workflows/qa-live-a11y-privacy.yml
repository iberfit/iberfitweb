name: IBERFIT WEB · Live accessibility and privacy audit

on:
  push:
    branches:
      - audit/prod-source-trace-20261119
    paths:
      - '.github/workflows/qa-live-a11y-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install libraries without downloading browsers
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.11.0 >/dev/null 2>&1
          if command -v google-chrome >/dev/null; then BROWSER="$(command -v google-chrome)";
          elif command -v google-chrome-stable >/dev/null; then BROWSER="$(command -v google-chrome-stable)";
          elif command -v chromium >/dev/null; then BROWSER="$(command -v chromium)";
          else exit 1; fi
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          cp .github/scripts/qa_v628_accesibilidad.mjs .github/scripts/qa-live-a11y-runtime.mjs
          cp .github/scripts/qa_v628_privacidad.mjs .github/scripts/qa-live-privacy-runtime.mjs
          sed -i 's/chromium.launch({ headless: true })/chromium.launch({ headless: true, executablePath: process.env.BROWSER })/' .github/scripts/qa-live-a11y-runtime.mjs
          sed -i 's/chromium.launch({ headless: true })/chromium.launch({ headless: true, executablePath: process.env.BROWSER })/' .github/scripts/qa-live-privacy-runtime.mjs
      - name: Accessibility WCAG A/AA live
        id: a11y
        continue-on-error: true
        env:
          BROWSER: ${{ steps.chrome.outputs.browser }}
          BASE_URL: https://iberfit.cl
        shell: bash
        run: node .github/scripts/qa-live-a11y-runtime.mjs 2>&1 | tee /tmp/a11y.log
      - name: Privacy/consent live
        id: privacy
        continue-on-error: true
        env:
          BROWSER: ${{ steps.chrome.outputs.browser }}
          BASE_URL: https://iberfit.cl
        shell: bash
        run: node .github/scripts/qa-live-privacy-runtime.mjs 2>&1 | tee /tmp/privacy.log
      - name: Summarize
        shell: bash
        run: |
          mkdir -p evidence/live-a11y-privacy
          printf '%s\n' '{"a11y":"${{ steps.a11y.outcome }}","privacy":"${{ steps.privacy.outcome }}"}' > evidence/live-a11y-privacy/summary.json
          cp /tmp/a11y.log evidence/live-a11y-privacy/a11y.log || true
          cp /tmp/privacy.log evidence/live-a11y-privacy/privacy.log || true
          cat evidence/live-a11y-privacy/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iberfit-live-a11y-privacy-${{ github.run_id }}
          path: evidence/live-a11y-privacy/
          retention-days: 30
