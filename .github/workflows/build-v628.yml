name: Construir candidata web V6.28

on:
  push:
    branches:
      - work/web-v6-28-recuperacion
    paths:
      - ".github/scripts/build_v628_candidate.py"
      - ".github/workflows/build-v628.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: web-v628-build
  cancel-in-progress: true

jobs:
  construir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: work/web-v6-28-recuperacion
          fetch-depth: 0

      - name: Generar V6.28 desde producción certificada
        run: python .github/scripts/build_v628_candidate.py

      - name: Restaurar isotipo oficial desde fuente canónica
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/iberfit/iberfit-m26-app/579bf36589c16d69b3fead9a75639982bb174e10/public/isotipo-iberfit.png"
          curl -fL --retry 3 --retry-all-errors "$URL" -o /tmp/iberfit-isotipo-oficial.png
          echo "d4707b688db39e11fee7d027bf9d3f2514225dfc806797ae3f9379d710ef07aa  /tmp/iberfit-isotipo-oficial.png" | sha256sum -c -
          test "$(wc -c < /tmp/iberfit-isotipo-oficial.png)" -eq 37519
          install -m 0644 /tmp/iberfit-isotipo-oficial.png brand/Isotipo_IBERFIT_Oficial.png
          install -m 0644 /tmp/iberfit-isotipo-oficial.png candidate/v628/assets/iberfit-isotipo-oficial.png
          cmp -s brand/Isotipo_IBERFIT_Oficial.png candidate/v628/assets/iberfit-isotipo-oficial.png

      - name: Minificar activos propios
        run: |
          set -euo pipefail
          for file in \
            candidate/v628/assets/styles.v628.css \
            candidate/v628/assets/app.v628.js \
            candidate/v628/assets/analytics.v628.js
          do
            npx --yes esbuild@0.25.9 "$file" --minify --outfile="$file.tmp"
            mv "$file.tmp" "$file"
          done

      - name: Verificar invariantes
        run: |
          test -s candidate/v628/index.html
          test -s candidate/v628/assets/styles.v628.css
          test "$(cat candidate/v628/VERSION)" = "6.28"
          echo "d4707b688db39e11fee7d027bf9d3f2514225dfc806797ae3f9379d710ef07aa  candidate/v628/assets/iberfit-isotipo-oficial.png" | sha256sum -c -
          ! grep -R -E -i "overall index|overall score|iri global|índice global|puntuación global" candidate/v628 --include="*.html"
          ! grep -R -E ">Online<|>online<" candidate/v628 --include="*.html" | grep -v "/en/" || false

      - name: Registrar candidata reproducible
        id: registrar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate/v628 brand/Isotipo_IBERFIT_Oficial.png
          if git diff --cached --quiet; then
            echo "La candidata ya coincide con la salida reproducible."
          else
            git commit -m "feat(web): generar candidata V6.28"
            git pull --rebase origin work/web-v6-28-recuperacion
            git push origin HEAD:work/web-v6-28-recuperacion
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Lanzar certificación integral de la candidata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run qa-v628-dispositivos.yml --ref work/web-v6-28-recuperacion -f target_sha="${{ steps.registrar.outputs.sha }}"
          gh workflow run quality-v628.yml --ref work/web-v6-28-recuperacion -f target_sha="${{ steps.registrar.outputs.sha }}"
          echo "Certificación solicitada para ${{ steps.registrar.outputs.sha }}"
