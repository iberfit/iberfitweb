name: IBERFIT Home · Clean review proof

on:
  push:
    branches:
      - design/web-zero-cost-master-20261102
    paths:
      - '.github/workflows/qa-home-clean-review.yml'
      - 'candidate/v628/__review__/home-hero.html'
      - 'candidate/v628/assets/hero-experiment-a.css'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start local candidate
        shell: bash
        run: |
          python3 -m http.server 4173 --directory candidate/v628 >/tmp/home-clean-review.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/__review__/home-hero.html >/dev/null && break; sleep 1; done
      - name: Locate system Chrome
        id: chrome
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then BROWSER="$(command -v google-chrome)";
          elif command -v google-chrome-stable >/dev/null; then BROWSER="$(command -v google-chrome-stable)";
          elif command -v chromium >/dev/null; then BROWSER="$(command -v chromium)";
          else exit 1; fi
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
      - name: Render clean review screens
        shell: bash
        env:
          BROWSER: ${{ steps.chrome.outputs.browser }}
        run: |
          mkdir -p /tmp/home-clean
          common=(--headless=new --disable-gpu --no-sandbox --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=2600)
          "$BROWSER" "${common[@]}" --force-device-scale-factor=2 --window-size=1440,1000 --screenshot=/tmp/home-clean/home-desktop.png http://127.0.0.1:4173/__review__/home-hero.html
          "$BROWSER" "${common[@]}" --force-device-scale-factor=2 --window-size=820,1180 --screenshot=/tmp/home-clean/home-tablet.png http://127.0.0.1:4173/__review__/home-hero.html
          "$BROWSER" "${common[@]}" --force-device-scale-factor=3 --window-size=390,844 --screenshot=/tmp/home-clean/home-mobile.png http://127.0.0.1:4173/__review__/home-hero.html
      - uses: actions/upload-artifact@v4
        with:
          name: iberfit-home-clean-review-${{ github.run_id }}
          path: /tmp/home-clean/
          if-no-files-found: error
          retention-days: 14
