name: Release WEB IBERFIT V6.43.2 visual storytelling

on:
  push:
    branches:
      - work/web-v6-43-2-visual-storytelling
    paths:
      - '.github/workflows/release-web-v6432-visual.yml'
      - '.github/scripts/build_v6432_visual.py'
      - '.github/scripts/qa_v6432_visual.cjs'
      - '.github/assets/v6432/**'

permissions:
  contents: write

concurrency:
  group: release-web-v6432-visual
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/web-v6-43-2-visual-storytelling
          fetch-depth: 0

      - name: Verify exact certified V6.43.1 product baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='c58402596ed8f3c90bcc51e04fd4c2f2ba8a98b9'
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(tr -d '\r\n ' < candidate/v628/VERSION)" = '6.43.1'
          test "$(find candidate/v628 -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          git diff --exit-code "$BASE" HEAD -- candidate/v628

      - name: Build V6.43.2
        run: python3 .github/scripts/build_v6432_visual.py

      - name: Validate scope, assets and preserved product contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE='c58402596ed8f3c90bcc51e04fd4c2f2ba8a98b9'
          root='candidate/v628'
          test "$(tr -d '\r\n ' < "$root/VERSION")" = '6.43.2'
          test "$(find "$root" -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          test -s "$root/assets/visual.v6432.css"
          for f in app-online-plan.webp app-online-session.webp app-online-progress.webp app-hybrid-feedback.webp; do test -s "$root/assets/$f"; done
          test "$(grep -R -l '/assets/visual.v6432.css' "$root" --include='*.html' | wc -l | tr -d ' ')" = '4'
          grep -q '/assets/visual.v6432.css' "$root/online/index.html"
          grep -q '/assets/visual.v6432.css' "$root/hibrido/index.html"
          grep -q '/assets/visual.v6432.css' "$root/en/online/index.html"
          grep -q '/assets/visual.v6432.css' "$root/en/hybrid/index.html"
          ! grep -R -n -E 'Cliente QA|Cliente Prueba IBERFIT|Coach QA' "$root" --include='*.html'
          cmp <(git show "$BASE":candidate/v628/assets/analytics.v643.js) "$root/assets/analytics.v643.js"
          cmp <(git show "$BASE":candidate/v628/assets/menu.v642.js) "$root/assets/menu.v642.js"
          cmp <(git show "$BASE":candidate/v628/assets/app.v632.js) "$root/assets/app.v632.js"
          cmp <(git show "$BASE":candidate/v628/assets/a11y.v6431.css) "$root/assets/a11y.v6431.css"
          python3 - <<'PY'
          from pathlib import Path
          import gzip, json, re
          root=Path('candidate/v628')
          for path in root.rglob('*.html'):
              text=path.read_text(encoding='utf-8')
              for raw in re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, re.S):
                  json.loads(raw)
          expected={
              'app-online-plan.webp': 480,
              'app-online-session.webp': 400,
              'app-online-progress.webp': 400,
              'app-hybrid-feedback.webp': 400,
          }
          total=0
          for name,width in expected.items():
              data=(root/'assets'/name).read_bytes()
              total += len(data)
              if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise SystemExit(f'not WebP: {name}')
          if total > 30000:
              raise SystemExit(f'app visual budget exceeded: {total}')
          css=(root/'assets/visual.v6432.css').read_bytes()
          if len(gzip.compress(css,9)) > 5000:
              raise SystemExit('visual CSS gzip budget exceeded')
          print({'appVisualBytes':total,'visualCssBytes':len(css),'visualCssGzip':len(gzip.compress(css,9))})
          PY
          git add -N "$root/assets/visual.v6432.css" "$root/assets/app-online-plan.webp" "$root/assets/app-online-session.webp" "$root/assets/app-online-progress.webp" "$root/assets/app-hybrid-feedback.webp"
          changed="$(git diff --name-only "$BASE" -- candidate/v628 | sort)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = '12'
          test "$(printf '%s\n' "$changed" | grep -c '\.html$')" = '4'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/CHANGELOG.md'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/VERSION'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/_headers'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/assets/visual.v6432.css'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/assets/app-online-plan.webp'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/assets/app-online-session.webp'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/assets/app-online-progress.webp'
          printf '%s\n' "$changed" | grep -qx 'candidate/v628/assets/app-hybrid-feedback.webp'
          git diff --check "$BASE" -- candidate/v628

      - name: Browser regression on Online and Hybrid ES + EN
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --directory candidate/v628 >/tmp/v6432-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || true; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node .github/scripts/qa_v6432_visual.cjs

      - name: Commit certified V6.43.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate/v628
          git commit -m 'feat(web): visualise Online and Hybrid with real app evidence'
          git push origin HEAD:work/web-v6-43-2-visual-storytelling

      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-v6432-visual-evidence
          path: |
            /tmp/v6432-server.log
            /tmp/v6432-evidence
          if-no-files-found: warn
          retention-days: 30
