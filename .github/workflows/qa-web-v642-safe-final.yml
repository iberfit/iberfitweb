name: QA WEB IBERFIT V6.42 historical sentinel

on:
  workflow_dispatch:
  push:
    branches:
      - work/web-v6-42-performance-budget
    paths:
      - '.github/workflows/qa-web-v642-safe-final.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout certified V6.42 checkpoint
        uses: actions/checkout@v4
        with:
          ref: checkpoint/v642-performance-a11y-2026-09-19
          fetch-depth: 1

      - name: Verify certified V6.42 source invariants
        shell: bash
        run: |
          set -euo pipefail
          base='candidate/v628'
          test "$(tr -d '\r\n ' < "$base/VERSION")" = '6.42'
          test "$(find "$base" -name '*.html' -type f | wc -l | tr -d ' ')" = '33'
          test -s "$base/assets/app.v632.js"
          test -s "$base/assets/menu.v642.js"
          node --check "$base/assets/app.v632.js"
          node --check "$base/assets/menu.v642.js"
          test "$(find "$base" -name '*.html' -type f -print0 | xargs -0 grep -l '/assets/menu.v642.js' | wc -l | tr -d ' ')" = '33'
          ! find "$base" -name '*.html' -type f -print0 | xargs -0 grep -q '/assets/menu.v632.js'
          ! find "$base" -name '*.html' -type f -print0 | xargs -0 grep -q '/assets/hardening.v630.js'
          grep -q "script-src-attr 'none'" "$base/_headers"
          ! grep -q "'unsafe-inline'" "$base/_headers"

      - name: Verify immutable V6.42 Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bce8848f.web-iberfit.pages.dev'
          version="$(curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$origin/VERSION" | tr -d '\r\n ')"
          test "$version" = '6.42'
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$origin/" -o /tmp/v642-home.html
          grep -q '/assets/app.v632.js' /tmp/v642-home.html
          grep -q '/assets/menu.v642.js' /tmp/v642-home.html
          ! grep -q '/assets/menu.v632.js' /tmp/v642-home.html
          ! grep -q '/assets/hardening.v630.js' /tmp/v642-home.html
