name: Release WEB IBERFIT V6.43.22 UX first impression

on:
  push:
    branches: [work/web-v6-43-22-ux-first-impression]
    paths: [.github/workflows/release-web-v64322-ux-first-impression.yml]

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Rebuild reproducibly from exact V6.43.21 production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE=86f62e1f813e10720769a1a9c46887b6d79097b9
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git show "$BASE":candidate/v628/VERSION | tr -d '\r\n ')" = '6.43.21'
          git restore --source="$BASE" --staged --worktree candidate/v628
          python3 .github/scripts/build_v64322_ux_first_impression.py
      - name: Static product and semantic contracts
        run: python3 .github/scripts/qa_v64322_static.py
      - name: Browser regression and V6.43.22 UX QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          python3 -m http.server 4173 --directory candidate/v628 >/tmp/http.log 2>&1 &
          pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ok=1; break; fi; sleep .5; done
          test "$ok" -eq 1
          QA_OUT=/tmp/v64321-regression node .github/scripts/qa_v64321_browser.mjs
          QA_OUT=/tmp/v64322-screens node .github/scripts/qa_v64322_browser.mjs
      - name: Commit certified V6.43.22 product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IBERFIT Release Bot'
          git config user.email 'iberfit-release@users.noreply.github.com'
          git add candidate/v628
          git diff --cached --quiet && { echo 'Expected certified product changes but found none'; exit 1; }
          git commit -m 'feat(web): certify V6.43.22 first-impression UX'
          git push origin HEAD:work/web-v6-43-22-ux-first-impression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-v64322-ux-evidence
          path: |
            /tmp/v64322-screens
            /tmp/v64321-regression/metrics.json
          if-no-files-found: warn
          retention-days: 30

# retry after untracked-assets QA accounting fix
