name: Web GEO AEO certification and package
on:
  pull_request:
    branches: [production/web-iberfit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Certify and package public website only
        id: release
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < candidate/v628/VERSION)"
          python3 scripts/certify_geo_aeo_360.py --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node .github/scripts/qa_bilingual_architecture.cjs
          python3 .github/scripts/qa_v64330_commercial_authority.py
          python3 .github/scripts/qa_v64331_acquisition_scope.py
      - name: Commercial authority browser and contact journey
        run: |
          set -euo pipefail
          mkdir -p /tmp/iberfit-browser-qa
          npm install --prefix /tmp/iberfit-browser-qa --no-save --package-lock=false playwright@1.56.1 --loglevel=notice
          /tmp/iberfit-browser-qa/node_modules/.bin/playwright install chromium
          cp .github/scripts/qa_v64330_commercial_browser.mjs /tmp/iberfit-browser-qa/qa.mjs
          python3 -m http.server 4173 --directory candidate/v628 >/tmp/authority-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep .5
          done
          QA_OUT=/tmp/authority-qa node /tmp/iberfit-browser-qa/qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: IBERFIT-WEB-${{ steps.release.outputs.version }}-certified
          path: release-web/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-authority-browser-evidence
          path: /tmp/authority-qa/
          if-no-files-found: warn
